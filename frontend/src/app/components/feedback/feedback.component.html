<div class="feedback-container">
  <div class="feedback-header">
    <h2>We Value Your Feedback</h2>
    <p>Have suggestions, found a bug, or want to request a new feature? We'd love to hear from you!</p>
  </div>

  <div class="feedback-content">
    <div class="feedback-info">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <h3>Send us an email</h3>
      <p>Click the button below to open your email client and send us your thoughts directly.</p>
    </div>
    
    <button 
      class="email-feedback-btn" 
      (click)="openEmailClient()"
      type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      Send Feedback via Email
    </button>

    <div class="email-address">
      <span>or email us directly at:</span>
      <a href="mailto:trainlink.info@gmail.com" class="email-link">trainlink.info&#64;gmail.com</a>
    </div>
  </div>
</div>
