<!-- Navigation - Only show on public pages -->
<nav class="navbar" *ngIf="showNavbar">
  <div class="nav-container">
    <div class="nav-logo">
      <a routerLink="/home" class="logo-link">
        <img src="assets/trainlink-logo.png" alt="TrainLink Logo" class="logo-image">
        <span class="logo-text">TrainLink</span>
      </a>
    </div>
    
    <!-- Show different navigation based on auth state -->
    <div *ngIf="!currentUser" class="nav-links">
      <a routerLink="/home" fragment="features" class="nav-link">Features</a>
      <a routerLink="/home" fragment="how-it-works" class="nav-link">How it works</a>
    </div>
    
    <div *ngIf="!currentUser" class="auth-buttons">
      <a routerLink="/signin" class="signin-btn">Sign in</a>
      <a routerLink="/signup" class="signup-btn">Get the plan</a>
    </div>

    <!-- Show user info and actions when authenticated -->
    <div *ngIf="currentUser" class="user-nav">
      <div class="user-info">
        <div class="user-avatar">
          <img *ngIf="currentUser.photoURL" [src]="currentUser.photoURL" [alt]="currentUser.displayName || 'User'">
          <span *ngIf="!currentUser.photoURL" class="avatar-placeholder">
            {{ getInitials(currentUser.displayName || currentUser.email || 'U') }}
          </span>
        </div>
        <div class="user-details">
          <span class="user-name">{{ currentUser.displayName || 'User' }}</span>
          <span class="user-email">{{ currentUser.email }}</span>
        </div>
      </div>
      <a routerLink="/dashboard" class="dashboard-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <button class="signout-btn" (click)="signOut()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16,17 21,12 16,7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        <span>Sign Out</span>
      </button>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>
